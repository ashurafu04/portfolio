<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Language-neutral metadata. Per-language tags (title, description,
         canonical, hreflang, og/twitter text, JSON-LD) are injected at the
         app-head placeholder below by scripts/prerender.mjs (src/seo/head.js). -->
    <meta name="author" content="Achraf Malki" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#0987f2" />
    <meta name="color-scheme" content="light dark" />
    <link rel="author" href="https://www.linkedin.com/in/achraf-malki/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Achraf Malki" />
    <meta property="og:image" content="https://achrafmalki.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AchrafMalkiEng" />
    <meta name="twitter:creator" content="@AchrafMalkiEng" />
    <meta name="twitter:image" content="https://achrafmalki.dev/og.png" />
    <!--app-head-->

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@100..700&family=Rubik:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Synchronous Theme & Critical Styling Engine (Eliminates FOUC & white flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved ? saved : (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-animate-ready', '');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      :root {
        --background-color: #f3fffe;
        --background-rgb: 243, 255, 254;
        --text-color: #222222;
      }
      [data-theme="dark"] {
        --background-color: #313131;
        --background-rgb: 49, 49, 49;
        --text-color: #ffffff;
      }
      html, body {
        background-color: var(--background-color);
        color: var(--text-color);
      }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
